[workspace]
members = ["crates/portiva-core", "crates/portiva-desktop"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
