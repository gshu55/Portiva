[package]
name = "portiva"
version = "1.9.0"
description = "A Tauri App"
authors = ["gshu"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "rustls-tls", "socks"] }
# Keep the updater's reqwest 0.13 SOCKS support enabled through Cargo feature unification.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
russh = { version = "0.60.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1.2"
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }
portable-pty = "0.9.0"
serial2 = "0.2.37"
arboard = "3.6.1"
encoding_rs = "0.8"
keyring = "4.1.5"
fontdb = "0.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Graphics_DirectWrite",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
