name: Release Portiva

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: --bundles nsis
            updaterArtifact: src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            platform: ubuntu-22.04
            target: ""
            args: --bundles appimage,deb
            updaterArtifact: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app,dmg --target aarch64-apple-darwin
            updaterArtifact: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $expectedTag = "v$packageVersion"
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion."
          }
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion. Expected $expectedTag."
          }

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Portiva v__VERSION__"
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      - name: Verify updater artifact
        shell: pwsh
        env:
          UPDATER_ARTIFACT_GLOB: ${{ matrix.updaterArtifact }}
        run: |
          $artifacts = @(Get-ChildItem -Path $env:UPDATER_ARTIFACT_GLOB -ErrorAction SilentlyContinue)
          if ($artifacts.Count -eq 0) {
            throw "Updater artifact was not generated: $env:UPDATER_ARTIFACT_GLOB"
          }
          $artifacts | ForEach-Object { Write-Host "Verified updater artifact: $($_.Name)" }

  finalize-updater:
    name: Finalize updater manifest
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use direct release downloads in updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Release tag does not match package version" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          node scripts/normalize-updater-manifest.mjs "$RUNNER_TEMP/updater/latest.json" "$RUNNER_TEMP/release.json" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
